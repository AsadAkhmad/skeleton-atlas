<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Skeleton Atlas</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,400&display=swap"><script defer src="/_vercel/insights/script.js"></script><style>
:root{--bg:#0d0f12;--bg2:#12151a;--panel:#14171c;--panel2:#191d23;--line:#262b33;--line2:#2f353e;--fg:#ece8e0;--muted:#979da6;--faint:#646a73;--accent:#e8b04a;--accent-ink:#1b1305;--blue:#6fa8d6;
--serif:'Newsreader',Georgia,'Times New Roman',serif;--sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;color-scheme:dark}

#sys{border-bottom:1px solid var(--line);padding:8px 8px 6px;max-height:44%;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line2) transparent;flex:none}
.sysh{display:flex;justify-content:space-between;align-items:baseline;margin:2px 8px 6px;font:600 10.5px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.sysh em{font:11px var(--mono);font-style:normal;letter-spacing:0;text-transform:none}
.sysrow{display:grid;grid-template-columns:1fr auto;align-items:center}
.systog{display:flex;align-items:center;gap:8px;border:0;background:none;padding:6px 8px;border-radius:8px;font-size:12.5px;font-weight:600;text-align:left;color:var(--muted)}
.systog:hover:not(:disabled){background:var(--panel2);color:var(--fg)}
.systog[aria-pressed=true]{color:var(--fg)}
.systog[aria-pressed=true] .sw{box-shadow:0 0 0 3px rgba(255,255,255,.16)}
.systog:disabled,.sysexp:disabled{opacity:.42;cursor:default}
.sysrow.busy .systog .rc::after{content:'building…';color:var(--accent)}
.sysexp{width:28px;height:28px;border:0;background:none;color:var(--faint);border-radius:7px}
.sysexp:hover:not(:disabled){background:var(--panel2);color:var(--fg)}
.sysrow.open .sysexp{transform:rotate(180deg)}
.sysitems{grid-column:1/-1;display:none;padding:0 0 4px 20px}
.sysrow.open .sysitems{display:block}
.sysit{display:flex;align-items:center;gap:4px}
.sysit .nm{flex:1;border:0;background:none;text-align:left;color:#cfcbc2;font-size:12.5px;padding:4px 7px;border-radius:6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sysit .nm:hover{background:var(--panel2);color:var(--fg)}
.sysit.sel .nm{background:rgba(232,176,74,.16);color:#fff2d6}
.sysit.off .nm{color:var(--faint);text-decoration:line-through}
.sysit .e{border:0;background:none;color:var(--muted);width:24px;height:24px;border-radius:6px;font-size:13px}
.seg{display:flex;gap:2px;padding:2px;margin:2px 0 6px;background:var(--bg2);border:1px solid var(--line);border-radius:9px}
.seg button{flex:1;border:0;background:none;color:var(--muted);height:26px;border-radius:7px;font-size:12px;font-weight:600}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.sexline{display:flex;align-items:center;gap:8px;margin:0 6px 6px}
.sexline label{font:600 10.5px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.sexline .seg{flex:1;margin:0}
.secbtn{margin-left:auto;border:1px solid var(--line2);background:var(--bg2);color:var(--muted);border-radius:8px;height:26px;padding:0 12px;font-size:12px;font-weight:600}
.secbtn[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.skinop{display:flex;align-items:center;gap:8px;padding:4px 6px 2px;color:var(--muted);font-size:12px}
.skinop input{flex:1;accent-color:var(--accent);min-width:0}
.skinop output{font:11px var(--mono);width:34px;text-align:right}
.sysit .e:hover{background:var(--panel2);color:var(--fg)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{--lw:292px;--rw:352px;display:grid;grid-template-columns:var(--lw) minmax(0,1fr) var(--rw);height:100%;background:var(--bg)}
aside{background:var(--panel);min-height:0;display:flex;flex-direction:column;position:relative;z-index:5}
#left{border-right:1px solid var(--line)}
#right{border-left:1px solid var(--line)}
.brand{display:flex;gap:12px;align-items:center;padding:16px 16px 12px}
.mark{width:34px;height:34px;flex:none;border-radius:9px;background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center;color:var(--accent)}
.brand h1{margin:0;font:600 20px/1.1 var(--serif);letter-spacing:.2px}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}
.search{position:relative;padding:0 14px 10px;border-bottom:1px solid var(--line)}
.search input{width:100%;height:36px;border-radius:9px;border:1px solid var(--line2);background:var(--bg2);color:var(--fg);padding:0 12px;font:inherit;font-size:13px}
.search input::placeholder{color:var(--faint)}
#qcount{display:block;margin:6px 2px 0;font:11px var(--mono);color:var(--faint)}
#tree{overflow:auto;flex:1;padding:6px 8px 40px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.reg{margin:4px 0}
.reg.off .rhead .rn{color:var(--faint);text-decoration:line-through}
.rhead{display:flex;align-items:center;gap:4px;position:sticky;top:0;background:var(--panel);z-index:2;padding:2px 0}
.rtoggle{flex:1;display:flex;align-items:center;gap:8px;border:0;background:none;padding:7px 8px;border-radius:8px;text-align:left;font-weight:600;font-size:12.5px;letter-spacing:.02em}
.rtoggle:hover{background:var(--panel2)}
.sw{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.rn{flex:1}
.rc{font:11px var(--mono);color:var(--faint)}
.eye{border:0;background:none;color:var(--muted);width:30px;height:30px;border-radius:8px;display:grid;place-items:center}
.eye:hover{background:var(--panel2);color:var(--fg)}
.eye .slash{opacity:0}.eye[aria-pressed=false] .slash{opacity:1}.eye[aria-pressed=false]{color:var(--faint)}
.sub{margin:10px 8px 3px;font:600 10.5px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--faint);display:flex;justify-content:space-between}
.sub em{font:11px var(--mono);font-style:normal}
.item{display:flex;width:100%;align-items:center;gap:8px;border:0;background:none;text-align:left;padding:5px 8px 5px 14px;border-radius:7px;color:#cfcbc2;font-size:13px;min-height:28px}
.item:hover,.item.hov{background:var(--panel2);color:var(--fg)}
.item.sel{background:rgba(232,176,74,.16);color:#fff2d6}
.item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sd{font:600 10px var(--mono);padding:1px 5px;border-radius:5px;background:var(--bg2);color:var(--muted);border:1px solid var(--line)}
.sel .sd{border-color:rgba(232,176,74,.5);color:var(--accent)}
.stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:radial-gradient(ellipse 70% 60% at 50% 42%,#252b33 0%,#161a20 52%,#0b0d10 100%)}
#c{position:absolute;inset:0;display:block;touch-action:none;cursor:grab;outline:none}
#lines,#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#lines{width:100%;height:100%}
.ln{fill:none;stroke:rgba(215,208,190,.3);stroke-width:.8}
.ln.hot{stroke:var(--accent);stroke-width:1.3}
.lb{position:absolute;left:0;top:0;pointer-events:auto;border:1px solid rgba(255,255,255,.09);background:rgba(14,16,20,.74);color:#d9d5cb;font:500 11px/1 var(--sans);padding:4px 8px;border-radius:11px;white-space:nowrap;backdrop-filter:blur(3px);will-change:transform}
.lb:hover,.lb.hot{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#tip{position:absolute;left:0;top:0;pointer-events:none;background:rgba(11,13,16,.94);border:1px solid var(--line2);border-radius:8px;padding:6px 10px;opacity:0;transition:opacity .12s;z-index:8;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#tip b{display:block;font:600 13px var(--sans)}#tip b i{font-style:normal;color:var(--accent);font-weight:500}
#tip span{font-size:11px;color:var(--muted)}
.toolbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:4px 6px;align-items:center;background:rgba(18,21,26,.86);border:1px solid var(--line2);border-radius:14px;padding:6px;backdrop-filter:blur(8px);max-width:calc(100% - 20px);z-index:6;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.grp{display:flex;gap:2px;padding:0 4px;align-items:center}
.grp+.grp{border-left:1px solid var(--line2);padding-left:8px;margin-left:2px}
.toolbar button{border:0;background:none;color:var(--muted);height:32px;padding:0 11px;border-radius:9px;font-size:12.5px;font-weight:500;white-space:nowrap}
.toolbar button:hover{background:var(--panel2);color:var(--fg)}
.toolbar button.on,.toolbar button[aria-pressed=true]{color:var(--accent);background:rgba(232,176,74,.13)}
.views button.on{color:var(--accent-ink);background:var(--accent)}
.explode{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.explode input{width:96px;accent-color:var(--accent)}
.explode output{font:11px var(--mono);width:32px;color:var(--faint)}
.hint{position:absolute;left:16px;top:14px;font-size:12px;color:var(--faint);pointer-events:none;max-width:260px;z-index:3}
.hint b{color:var(--muted);font-weight:500}
.hide{position:absolute;right:10px;top:8px;z-index:3;border:0;background:var(--panel2);color:var(--muted);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1;display:grid;place-items:center}
.hide:hover{color:var(--fg);background:var(--line2)}
.brand .hide{position:static;margin-left:auto;flex:none}
.edgetab{display:none;position:absolute;right:0;top:50%;transform:translateY(-50%);z-index:7;border:1px solid var(--line2);border-right:0;background:rgba(18,21,26,.92);color:var(--fg);border-radius:10px 0 0 10px;padding:14px 7px;font:600 12px var(--sans);letter-spacing:.04em;writing-mode:vertical-rl}
.stage #loading{z-index:40}
#right .hd{padding-right:42px}
.edgetab:hover{background:var(--accent);color:var(--accent-ink)}
.toolbar.min>.grp:not(.keep){display:none}
.toolbar.min{padding:3px}
.fab{display:none;position:absolute;left:12px;top:12px;z-index:7;border:1px solid var(--line2);background:rgba(18,21,26,.9);border-radius:10px;height:36px;padding:0 14px;font-weight:600;font-size:13px}
#loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;display:grid;justify-items:center;gap:12px;padding:22px 30px;background:rgba(13,15,18,.78);border:1px solid var(--line2);border-radius:16px;backdrop-filter:blur(6px);transition:opacity .6s;text-align:center}
#loading.done{opacity:0;pointer-events:none}
#loading h2{margin:0;font:600 24px var(--serif)}
#loading p{margin:0;color:var(--muted);font-size:13px;font-family:var(--mono);height:18px}
.barwrap{width:min(320px,70vw);height:4px;background:var(--line);border-radius:4px;overflow:hidden}
#bar{height:100%;width:0;background:var(--accent);transition:width .15s}
/* right panel */
#detail{overflow:auto;flex:1;padding:16px 18px 40px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.x{display:none;position:absolute;right:10px;top:8px;z-index:3;border:0;background:var(--panel2);width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1}
.empty h2{margin:6px 0 8px;font:600 26px/1.15 var(--serif)}
.empty p{color:#b9b5ab}.muted{color:var(--muted)}
.facts{list-style:none;padding:0;margin:18px 0;display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.facts li{display:flex;gap:14px;align-items:baseline;background:var(--panel);padding:12px 14px}
.facts b{font:600 26px var(--serif);min-width:62px;color:var(--accent)}
.facts span{color:#c4c0b7;font-size:13px}
.hd .crumb{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.hd .crumb i{opacity:.4;font-style:normal}
.hd h2{margin:8px 0 4px;font:600 29px/1.12 var(--serif);letter-spacing:.1px;text-wrap:balance}
.lat{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:#b5b1a8}
.lat em{font:italic 400 16px var(--serif)}
.side{font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:99px;border:1px solid var(--line2);color:var(--muted)}
.side.L{color:#9cc4e6;border-color:#35536b}.side.R{color:#e6b79c;border-color:#6b4a35}.side.M{color:#c9c3a8;border-color:#55523f}
.type{margin-top:6px;font-size:12px;color:var(--faint)}
.nav{display:flex;gap:6px;margin:16px 0 4px}
.nav button,.btns button{flex:1;border:1px solid var(--line2);background:var(--panel2);border-radius:9px;height:34px;font-size:12.5px;font-weight:500;color:#d6d2c9}
.nav button:hover:not(:disabled),.btns button:hover{border-color:#4a525d;background:#20252c}
.nav button:disabled{opacity:.4;cursor:default}
#detail section{margin-top:22px}
#detail h3{margin:0 0 8px;font:600 10.5px var(--sans);letter-spacing:.11em;text-transform:uppercase;color:var(--faint);display:flex;gap:8px;align-items:baseline}
#detail h3 .muted{text-transform:none;letter-spacing:0;font-weight:400;font-size:11.5px}
#detail p{margin:0;color:#d7d3ca;font-size:14px;line-height:1.6}
.big{display:flex;align-items:baseline;gap:6px}
.big b{font:600 46px/1 var(--serif);font-variant-numeric:tabular-nums}
.big span{font:500 16px var(--mono);color:var(--muted)}
.big em{margin-left:auto;font-size:11.5px;font-style:normal;color:var(--faint)}
.scale{height:6px;background:var(--bg2);border-radius:4px;margin-top:10px;overflow:hidden;border:1px solid var(--line)}
.scale i{display:block;height:100%;background:linear-gradient(90deg,#b88a35,var(--accent));border-radius:4px}
.scalecap{font-size:11px;color:var(--faint);margin-top:5px}
dl{margin:14px 0 0;display:grid;grid-template-columns:1fr auto;gap:0;border-top:1px solid var(--line)}
dt,dd{margin:0;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
dt{color:var(--muted)}dd{font:500 12.5px var(--mono);text-align:right;color:#e4e0d6}
.feat{list-style:none;padding:0;margin:0;display:grid;gap:7px}
.feat li{position:relative;padding-left:16px;color:#d2cec5;font-size:13.5px;line-height:1.45}
.feat li::before{content:'';position:absolute;left:0;top:.62em;width:8px;height:1.5px;background:var(--accent);opacity:.7}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);background:var(--panel2);border-radius:99px;padding:4px 11px;font-size:12.5px;color:#d6d2c9}
.chip i{font:600 10px var(--mono);font-style:normal;color:var(--muted);margin-left:3px}
.chip:hover{border-color:var(--accent);color:#fff2d6}
.fact p{border:1px solid var(--line);background:var(--bg2);border-radius:11px;padding:12px 14px;color:#d9d0b8}
.locrow{display:flex;gap:14px;align-items:flex-start}
.body{width:74px;flex:none;color:#aaa;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:6px}
.locrow p{font-size:12.5px}
.btns{display:grid;gap:6px;margin-top:10px}
/* responsive */
@media (max-width:1180px){#app{--lw:260px;--rw:320px}.grp .lbl{display:none}}
@media (min-width:901px){
 #app.noleft{--lw:0px}#app.noleft #left{visibility:hidden;overflow:hidden;min-width:0;border:0}#app.noleft .fab{display:block}
 #app.noright{--rw:0px}#app.noright #right{visibility:hidden;overflow:hidden;min-width:0;border:0}#app.noright .edgetab{display:block}
}
@media (max-width:900px){
 #app{grid-template-columns:minmax(0,1fr)}
 #left{position:absolute;left:0;top:0;bottom:0;width:min(86vw,330px);transform:translateX(-102%);transition:transform .28s;z-index:30;box-shadow:12px 0 40px rgba(0,0,0,.5)}
 #left.open{transform:none}
 #right{position:absolute;left:0;right:0;bottom:0;height:54%;transform:translateY(102%);transition:transform .3s;z-index:25;border-left:0;border-top:1px solid var(--line2);border-radius:16px 16px 0 0;box-shadow:0 -14px 40px rgba(0,0,0,.5)}
 #right.open{transform:none}
 .x{display:block}.fab{display:block}
 #hideright{right:52px}
 #showright.on{display:block}
 .toolbar{bottom:10px}
 .hint{display:none}
 body:has(#right.open) .toolbar{bottom:calc(54% + 8px)}
 .toolbar{padding:4px;gap:2px 4px}.toolbar button{padding:0 8px;height:30px;font-size:12px}.grp{padding:0 2px}.explode input{width:84px}
 .lb{font-size:10px;padding:3px 6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="app">
  <aside id="left" aria-label="Bone list">
    <header class="brand">
      <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c-4 0-7 2.7-7 6.3 0 2.2 1.1 3.7 2.6 4.8V17a1 1 0 0 0 1 1H10v2.5M12 3c4 0 7 2.7 7 6.3 0 2.2-1.1 3.7-2.6 4.8V17a1 1 0 0 1-1 1H14v2.5M10 18v2.5M14 18v2.5"/><circle cx="9.3" cy="10" r="1.5"/><circle cx="14.7" cy="10" r="1.5"/></svg></div>
      <div><h1>Skeleton Atlas</h1><p>Adult human, 206 bones, 3D</p></div>
      <button id="hideleft" class="hide" aria-label="Hide the list" title="Hide the list ( [ )">‹</button>
    </header>
    <div class="search"><input id="q" type="search" placeholder="Search: femur, wrist, rib 7…" aria-label="Search bones" autocomplete="off"><span id="qcount">206 bones</span></div>
    <div id="sys"></div>
    <div id="tree"></div>
  </aside>
  <main class="stage">
    <canvas id="c" aria-label="3D skeleton. Drag to rotate, scroll to zoom, click a bone to select it." tabindex="0"></canvas>
    <svg id="lines"></svg><div id="labels"></div>
    <div id="tip"></div>
    <button id="openleft" class="fab">☰ Bones</button>
    <div class="toolbar" role="toolbar" aria-label="View controls">
      <div class="grp views"><button data-view="front" class="on">Front</button><button data-view="left">Side</button><button data-view="back">Back</button><button data-view="top">Top</button></div>
      <div class="grp"><button id="t-labels" title="Show bone names (L)">Names</button><button id="t-dim" title="Fade other bones when one is selected">Focus</button><button id="t-cart" title="Costal cartilage (not bone)">Cartilage</button><button id="t-teeth" title="Teeth (not counted as bones)">Teeth</button><button id="t-rot">Spin</button><button id="t-bones" title="Cycle the skeleton: solid, ghost, hidden">Bones: Solid</button></div>
      <div class="grp explode"><label for="explode">Explode</label><input id="explode" type="range" min="0" max="100" value="0"><output id="exv">0%</output></div>
      <div class="grp"><button id="reset">Reset</button></div>
      <div class="grp keep"><button id="t-min" aria-label="Hide or show the controls" title="Hide or show these controls ( h )">Hide ▾</button></div>
    </div>
    <button id="showright" class="edgetab" aria-label="Show details" title="Show the details panel ( ] )">Details</button>
    <div id="loading"><h2>Assembling the skeleton</h2><div class="barwrap"><div id="bar"></div></div><p id="loadtxt">starting…</p></div>

312 cm"},{k:"Weight",v:"\u2248 150 g"}],fact:"It sits under the left ribs, which is why a hard blow there can rupture it."},pancreas:{name:"Pancreas",latin:"Pancreas",fn:"Makes digestive enzymes that go into the duodenum, and the hormones insulin and glucagon that keep blood sugar steady.",size:[{k:"Length",v:"\u2248 12\u201315 cm"},{k:"Weight",v:"\u2248 80\u2013100 g"}],fact:"Only about 1\u20132% of it is hormone-making tissue (the islets)."},duodenum:{name:"Duodenum",latin:"Duodenum",fn:"The first part of the small intestine. Bile and pancreatic juice enter here, and most chemical digestion begins.",size:[{k:"Length",v:"\u2248 25 cm"},{k:"Shape",v:"C-shaped loop around the pancreas head"}],fact:'Its name means "twelve fingers", the length it was once measured to be.'},"small-intestine":{name:"Small intestine (jejunum and ileum)",latin:"Intestinum tenue",fn:"Where most digestion ends and nearly all nutrients are absorbed through millions of tiny finger-like folds (villi).",size:[{k:"Length",v:"\u2248 5\u20136 m (shown shorter, folded)"},{k:"Width",v:"\u2248 2.5\u20133 cm"}],fact:"Spread flat, its absorbing surface would cover a large room."},"large-intestine":{name:"Large intestine (colon)",latin:"Intestinum crassum",fn:"Absorbs water and salts from what is left, hosts gut bacteria, and forms and stores stool before it leaves through the rectum.",size:[{k:"Length",v:"\u2248 1.5 m"},{k:"Width",v:"\u2248 6 cm (wider at the start)"}],fact:"Its pouches (haustra) are what give it a bumpy look."},adrenals:{name:"Adrenal glands",latin:"Glandulae suprarenales",fn:"Small glands on top of each kidney that make stress hormones (adrenaline, cortisol) and hormones that control salt and blood pressure.",size:[{k:"Length",v:"\u2248 4\u20135 cm each"},{k:"Weight",v:"\u2248 5 g each"}],fact:"Adrenaline from them speeds your heart within seconds of a scare."},thyroid:{name:"Thyroid gland",latin:"Glandula thyroidea",fn:"A butterfly-shaped gland on the windpipe that sets the body\u2019s metabolic rate with thyroid hormones.",size:[{k:"Width",v:"\u2248 5 cm"},{k:"Weight",v:"\u2248 20 g"}],fact:"It needs iodine to work, which is why salt is often iodised."},eyes:{name:"Eyeballs",latin:"Bulbi oculorum",fn:"Focus light onto the retina, which turns it into nerve signals sent to the brain through the optic nerves.",size:[{k:"Diameter",v:"\u2248 2.4 cm"},{k:"Weight",v:"\u2248 7.5 g each"}],fact:"Each eye sits in a bony socket (orbit) and is moved by six small muscles."},larynx:{name:"Larynx (voice box)",latin:"Larynx",fn:"Guards the airway during swallowing and holds the vocal folds, which vibrate to make voice.",size:[{k:"Height",v:"\u2248 4\u20135 cm"},{k:"Cartilages",v:"thyroid, cricoid, epiglottis"}],fact:"The thyroid cartilage forms the \u201CAdam\u2019s apple\u201D."},trachea:{name:"Trachea (windpipe)",latin:"Trachea",fn:"Carries air between the larynx and the lungs. C-shaped cartilage rings keep it open, while the soft back wall lets food pass down the oesophagus.",size:[{k:"Length",v:"\u2248 10\u201312 cm"},{k:"Diameter",v:"\u2248 2 cm"}],fact:"Tiny hairs (cilia) in its lining sweep mucus and dust up toward the throat."},bronchi:{name:"Bronchi and bronchial tree",latin:"Bronchi",fn:"The windpipe splits into two main bronchi, then keeps branching into ever thinner tubes that carry air deep into each lung.",size:[{k:"Branches",v:"\u2248 23 generations in life"},{k:"Shown",v:"first \u2248 6 generations"}],fact:"The right main bronchus is shorter, wider and steeper, so swallowed objects more often end up on that side."},"lung-R":{name:"Right lung",latin:"Pulmo dexter",fn:"Brings oxygen into the blood and removes carbon dioxide. The right lung has three lobes separated by two fissures.",size:[{k:"Height",v:"\u2248 25\u201327 cm"},{k:"Weight",v:"\u2248 600 g"}],fact:"It is a little larger than the left lung, which shares space with the heart."},"lung-L":{name:"Left lung",latin:"Pulmo sinister",fn:"Brings oxygen into the blood and removes carbon dioxide. The left lung has two lobes and a notch (cardiac notch) for the heart.",size:[{k:"Height",v:"\u2248 25\u201327 cm"},{k:"Weight",v:"\u2248 550 g"}],fact:"Together the lungs hold about 300 million tiny air sacs (alveoli)."},heart:{name:"Heart",latin:"Cor",fn:"A four-chambered muscular pump. The right side sends blood to the lungs to pick up oxygen; the left side pumps oxygen-rich blood to the whole body.",size:[{k:"Length",v:"\u2248 12 cm"},{k:"Weight",v:"\u2248 300 g"}],fact:"It beats about 100,000 times a day."},arteries:{name:"Arteries",latin:"Arteriae",fn:"Carry oxygen-rich blood away from the heart, from the aorta through the neck, arms, organs and legs.",size:[{k:"Aorta",v:"\u2248 2.5\u20133 cm wide at its root"},{k:"Shown",v:"main trunks only"}],fact:"Arteries have thick muscular walls because they carry blood under high pressure."},veins:{name:"Veins",latin:"Venae",fn:"Return oxygen-poor blood to the heart. Valves inside the leg veins stop blood from flowing backward.",size:[{k:"Vena cava",v:"\u2248 2\u20133 cm wide"},{k:"Shown",v:"main trunks only"}],fact:"About two-thirds of your blood is in the veins at any moment."},pulmonary:{name:"Pulmonary vessels",latin:"Vasa pulmonalia",fn:"The pulmonary arteries (blue here) carry oxygen-poor blood from the heart to the lungs; the pulmonary veins (red) bring oxygen-rich blood back.",size:[{k:"Trunk",v:"\u2248 5 cm long, 3 cm wide"},{k:"Veins",v:"4 in total"}],fact:"These are the only arteries that carry oxygen-poor blood, and the only veins that carry oxygen-rich blood."},"kidney-R":{name:"Right kidney",latin:"Ren dexter",fn:"Filters the blood, removes waste as urine, and balances water, salts and blood pressure.",size:[{k:"Length",v:"\u2248 11 cm"},{k:"Weight",v:"\u2248 150 g"}],fact:"It sits slightly lower than the left because the liver pushes it down."},"kidney-L":{name:"Left kidney",latin:"Ren sinister",fn:"Filters the blood, removes waste as urine, and balances water, salts and blood pressure.",size:[{k:"Length",v:"\u2248 11 cm"},{k:"Weight",v:"\u2248 150 g"}],fact:"Each kidney holds about a million tiny filters (nephrons)."},ureters:{name:"Ureters",latin:"Ureteres",fn:"Two thin muscular tubes that carry urine from the kidneys to the bladder with waves of contraction.",size:[{k:"Length",v:"\u2248 25\u201330 cm each"},{k:"Width",v:"\u2248 3\u20134 mm"}],fact:"Kidney stones often stick where the ureter narrows near the bladder."},bladder:{name:"Urinary bladder",latin:"Vesica urinaria",fn:"A stretchy muscular bag that stores urine until it is passed out through the urethra.",size:[{k:"Capacity",v:"\u2248 400\u2013600 mL"},{k:"Feels full at",v:"\u2248 300 mL"}],fact:"Its wall folds flat when empty and stretches as it fills."},brain:{name:"Brain (cerebrum)",latin:"Cerebrum",fn:"The seat of thought, memory, speech, movement planning and the senses. Two hemispheres are joined in the middle and folded into ridges (gyri) to fit inside the skull.",size:[{k:"Length",v:"\u2248 16 cm"},{k:"Weight",v:"\u2248 1.3\u20131.4 kg (whole brain)"}],fact:"It uses about 20% of the body\u2019s energy at rest."},cerebellum:{name:"Cerebellum",latin:"Cerebellum",fn:"Fine-tunes movement, balance and coordination.",size:[{k:"Width",v:"\u2248 9\u201310 cm"},{k:"Weight",v:"\u2248 150 g"}],fact:"It holds more than half of all the brain\u2019s nerve cells in only about 10% of its volume."},brainstem:{name:"Brainstem",latin:"Truncus encephali",fn:"Connects the brain to the spinal cord and controls breathing, heart rate and consciousness.",size:[{k:"Length",v:"\u2248 7 cm"},{k:"Width",v:"\u2248 2\u20133 cm"}],fact:"Nearly every signal between brain and body passes through it."},"spinal-cord":{name:"Spinal cord",latin:"Medulla spinalis",fn:"The main cable between the brain and the body; it also handles quick reflexes. It ends around the first or second lumbar vertebra, followed by a fan of nerve roots (cauda equina).",size:[{k:"Length",v:"\u2248 42\u201345 cm"},{k:"Width",v:"\u2248 1\u20131.3 cm"}],fact:"The cord is much shorter than the spine, which is why lumbar punctures are done below it."},"spinal-nerves":{name:"Spinal nerves",latin:"Nervi spinales",fn:"Thirty-one pairs of nerves leave the spinal cord between the vertebrae, carrying movement signals out and touch and pain signals in.",size:[{k:"Pairs",v:"31"},{k:"Shown",v:"C1 to L5 (short stubs)"}],fact:"The thoracic ones run along the ribs as intercostal nerves."},"cranial-nerves":{name:"Optic and vagus nerves",latin:"Nervi optici et vagi",fn:"The optic nerves carry sight from the eyes to the brain. The vagus nerves wander from the brainstem down the neck to the heart, lungs and gut and slow the heartbeat.",size:[{k:"Optic",v:"\u2248 5 cm"},{k:"Vagus",v:"\u2248 50+ cm"}],fact:"\u201CVagus\u201D means wandering."},"arm-nerves-L":{name:"Brachial plexus and arm nerves (left)",latin:"Plexus brachialis",fn:"Nerves from the neck (C5 to T1) weave into the brachial plexus, then become the median, ulnar and radial nerves that move and feel the arm and hand.",size:[{k:"Median",v:"runs to the thumb side of the hand"},{k:"Ulnar",v:"the \u201Cfunny bone\u201D nerve"}],fact:"Hitting the ulnar nerve at the elbow causes the familiar tingling in the little finger."},"arm-nerves-R":{name:"Brachial plexus and arm nerves (right)",latin:"Plexus brachialis",fn:"Nerves from the neck (C5 to T1) weave into the brachial plexus, then become the median, ulnar and radial nerves that move and feel the arm and hand.",size:[{k:"Median",v:"runs to the thumb side of the hand"},{k:"Ulnar",v:"the \u201Cfunny bone\u201D nerve"}],fact:"The radial nerve winds around the back of the humerus."},"leg-nerves-L":{name:"Sciatic and leg nerves (left)",latin:"Nervus ischiadicus et ramii",fn:"The sciatic nerve, the thickest in the body, runs down the back of the thigh and splits near the knee into the tibial and common peroneal nerves. The femoral nerve serves the front of the thigh.",size:[{k:"Sciatic width",v:"\u2248 1\u20132 cm"},{k:"Length",v:"\u2248 100+ cm to the foot"}],fact:"\u201CSciatica\u201D is pain from irritation of its roots in the lower back."},"leg-nerves-R":{name:"Sciatic and leg nerves (right)",latin:"Nervus ischiadicus et ramii",fn:"The sciatic nerve, the thickest in the body, runs down the back of the thigh and splits near the knee into the tibial and common peroneal nerves. The femoral nerve serves the front of the thigh.",size:[{k:"Sciatic width",v:"\u2248 1\u20132 cm"},{k:"Length",v:"\u2248 100+ cm to the foot"}],fact:"The common peroneal nerve wraps around the neck of the fibula and is easy to bruise."},uterus:{name:"Uterus (womb) and cervix",latin:"Uterus et cervix uteri",fn:"A hollow, thick-walled muscular organ. A fertilised egg implants in its lining (endometrium), which thickens each month and is shed as menstrual flow if there is no pregnancy. Its muscle wall (myometrium) contracts strongly in labour. The cervix is the narrow lower neck that opens into the vagina through the external os.",size:[{k:"Length",v:"\u2248 7\u20138 cm (not pregnant), cervix \u2248 2.5\u20133 cm"},{k:"Width at the top",v:"\u2248 4\u20135 cm"},{k:"Weight",v:"\u2248 50\u201370 g"},{k:"Cavity",v:"a flat triangle \u2248 3 cm wide"}],att:"Held in place by the broad, round, cardinal and uterosacral ligaments and the pelvic floor. It normally tips forward over the bladder (anteverted, anteflexed).",fact:"In pregnancy it grows to hold a baby, becoming about 500 times larger by volume. Press \u201CSection view\u201D to see the triangular cavity and the cervical canal."},"uterine-tubes":{name:"Uterine (fallopian) tubes",latin:"Tubae uterinae",fn:"Two tubes that catch the egg released by an ovary with finger-like fringes (fimbriae) and carry it toward the uterus by gentle muscle waves and tiny beating hairs. Fertilisation usually happens in the wide middle part (ampulla).",size:[{k:"Length",v:"\u2248 10\u201312 cm each"},{k:"Parts",v:"interstitial, isthmus, ampulla, infundibulum with fimbriae"},{k:"Width",v:"\u2248 1\u20134 mm inside, up to \u2248 1 cm at the funnel"}],fact:"An egg usually spends about 3\u20134 days travelling along the tube."},ovaries:{name:"Ovaries",latin:"Ovaria",fn:"Two almond-sized glands that store egg cells in follicles, release one about every month (ovulation), and make the hormones oestrogen and progesterone. The yellow patch shown is a corpus luteum, the remains of a follicle after ovulation.",size:[{k:"Size",v:"\u2248 3 \xD7 2 \xD7 1 cm each"},{k:"Weight",v:"\u2248 5\u201310 g each"}],fact:"A person is born with about one to two million immature eggs; only some hundreds are ever released."},"uterine-ligaments":{name:"Ovarian, suspensory and round ligaments",latin:"Ligamenta ovarii proprium, suspensorium ovarii, teres uteri",fn:"Fibrous cords that keep the ovaries and uterus in place. The ovarian ligament joins each ovary to the uterus, the suspensory ligament carries the ovary\u2019s blood vessels, and the round ligament runs from the uterus through the groin to the labia majora.",size:[{k:"Round ligament",v:"\u2248 10\u201312 cm"},{k:"Ovarian ligament",v:"\u2248 2.5 cm"}],fact:"The round ligament stretches in pregnancy, which can cause a sharp pain in the groin."},vagina:{name:"Vagina",latin:"Vagina",fn:"A flexible muscular canal about 9 cm long from the vestibule to the cervix. It receives sperm, carries menstrual flow out and is the birth canal. Its walls are normally collapsed together in an H shape, folded into cross ridges (rugae) so they can stretch widely. The space around the cervix at the top is the fornix.",size:[{k:"Length",v:"\u2248 7\u201310 cm (front wall shorter than back wall)"},{k:"Wall",v:"\u2248 3\u20134 mm: lining, muscle, outer layer"},{k:"Angle",v:"tilts up and back, \u2248 60\xB0 to the horizontal"}],att:"It opens into the vestibule between the labia minora, where a thin ring of tissue (the hymenal remnant) may surround the opening. The urethra lies in front of it and the rectum behind.",fact:"Its lining makes no glands of its own; it is kept moist by fluid from the cervix and from the vestibular glands. Press \u201CSection view\u201D to open it along its length."},"urethra-female":{name:"Female urethra",latin:"Urethra feminina",fn:"A short tube that carries urine from the bladder to the outside. The opening (external urethral meatus) lies between the clitoris and the vaginal opening.",size:[{k:"Length",v:"\u2248 4 cm"},{k:"Width",v:"\u2248 6\u20138 mm"}],fact:"It is much shorter than the male urethra, which is one reason urinary infections are more common in women."},vulva:{name:"Vulva (external genitalia)",latin:"Pudendum femininum",fn:"The external female genital structures: the mons pubis (fatty pad over the pubic bone), the larger outer folds (labia majora), the thinner inner folds (labia minora) and the clitoral hood. They protect the openings of the urethra and vagina.",size:[{k:"Labia majora",v:"\u2248 7\u20138 cm long"},{k:"Labia minora",v:"\u2248 3\u20135 cm long, very variable"}],fact:"Shapes, sizes and colours of the labia vary a great deal between people, and all of it is normal."},clitoris:{name:"Clitoris, vestibular bulbs and Bartholin glands",latin:"Clitoris, bulbi vestibuli, glandulae vestibulares majores",fn:"The clitoris is mostly inside the body: a small visible glans, a body, and two long arms (crura) that run back along the pubic bones, with two erectile vestibular bulbs beside the vaginal opening. It is rich in nerves and fills with blood when aroused. The yellow Bartholin glands release a little moisture at the vaginal opening.",size:[{k:"Total length",v:"\u2248 9\u201311 cm including the crura"},{k:"Visible glans",v:"\u2248 5\u201310 mm"},{k:"Nerve endings",v:"\u2248 8,000"}],fact:"It has the same embryonic origin as the penis, and is made of the same kind of erectile tissue."},breasts:{name:"Breasts (mammary glands)",latin:"Mammae",fn:"Each breast is mostly fat and connective tissue around 12\u201320 lobes of milk-making gland. A duct from each lobe runs to the nipple. After childbirth, hormones make the lobes produce milk. The darker ring around the nipple is the areola.",size:[{k:"Glandular tissue",v:"\u2248 12\u201320 lobes"},{k:"Position",v:"ribs 2\u20136, over the pectoral muscle"},{k:"Size",v:"varies widely"}],fact:"Men have the same tissue in small amounts and can also develop breast cancer."},"testes-epididymis":{name:"Testes, epididymis and vas deferens",latin:"Testes, epididymides et ductus deferentes",fn:"The testes make sperm and testosterone. Sperm pass into the epididymis (head, body and tail), a coiled tube where they mature, and are stored until ejaculation. The vas deferens carries them up the spermatic cord through the groin and over the bladder. They hang in the scrotum, 2\u20133 \xB0C cooler than the body, which sperm need.",size:[{k:"Testis",v:"\u2248 4.5\u20135 \xD7 3 cm, \u2248 15\u201325 g each"},{k:"Epididymis",v:"\u2248 6 m of coiled tube in \u2248 7 cm"},{k:"Vas deferens",v:"\u2248 30\u201345 cm"}],fact:"Sperm take about 2\u20133 months to develop and another 2 weeks to mature. A vasectomy cuts and seals the vas deferens."},"seminal-vesicles":{name:"Seminal vesicles",latin:"Glandulae vesiculosae",fn:"Two small, coiled glands behind the bladder that add a fructose-rich fluid to semen to feed the sperm. Each joins the end of the vas deferens to form the ejaculatory duct.",size:[{k:"Length",v:"\u2248 5 cm each (unfolded \u2248 10\u201315 cm)"},{k:"Share of semen",v:"\u2248 60%"}],fact:"Each is a single folded tube, about as long as a ruler when unwound."},prostate:{name:"Prostate gland",latin:"Prostata",fn:"A walnut-sized gland under the bladder that surrounds the first part of the urethra (the prostatic urethra). It adds a milky fluid to semen, and the two ejaculatory ducts pass through it to open into the urethra.",size:[{k:"Size",v:"\u2248 4 \xD7 3 \xD7 2 cm"},{k:"Weight",v:"\u2248 20 g"}],att:"It sits on the pelvic floor behind the pubic symphysis and in front of the rectum.",fact:"It often enlarges with age and can squeeze the urethra, slowing urine flow. Press \u201CSection view\u201D to see the urethra and ducts inside."},bulbourethral:{name:"Bulbourethral (Cowper\u2019s) glands",latin:"Glandulae bulbourethrales",fn:"Two pea-sized glands below the prostate that release a clear lubricating fluid into the urethra before ejaculation.",size:[{k:"Size",v:"\u2248 5\u20138 mm each"}],fact:"Their fluid also helps neutralise acid left in the urethra by urine."},penis:{name:"Penis (shaft, glans and skin)",latin:"Penis",fn:"Carries urine from the bladder to the outside through the urethra, and delivers semen. The tip is the glans, with a ridge (corona) at its base and the urethral opening (meatus). Shown relaxed, hanging from the pubic bone; there is no bone inside.",size:[{k:"Length",v:"\u2248 9\u201310 cm relaxed, \u2248 13 cm erect"},{k:"Diameter",v:"\u2248 3 cm relaxed, \u2248 3.5 cm erect"}],fact:"Press \u201CSection view\u201D to see the erectile tissue and the urethra inside."},"penis-erectile":{name:"Penile erectile bodies and urethra",latin:"Corpora cavernosa, corpus spongiosum et urethra",fn:"Three columns of spongy tissue fill with blood to cause an erection: two corpora cavernosa on the upper side, which attach to the pubic bones as the crura, and the corpus spongiosum below, which surrounds the urethra and swells into the bulb at the root and the glans at the tip.",size:[{k:"Corpora cavernosa",v:"2, \u2248 1.5 cm wide each"},{k:"Urethra inside",v:"\u2248 15\u201316 cm in the penis"}],fact:"The spongiosum stays softer so the urethra is not squeezed shut during an erection."},"orbicularis-oculi":{name:"Orbicularis oculi",latin:"Musculus orbicularis oculi",fn:"A ring of muscle around each eye socket. It closes the eyelids for blinking and squeezing the eyes shut, and spreads tears across the eye.",att:"Fibres circle the bony orbit and the eyelids; the inner part runs to the medial corner of the eye.",size:[{k:"Width",v:"\u2248 5\u20136 cm each"},{k:"Thickness",v:"< 1 mm in the eyelid"}],fact:"A blink takes about 0.1\u20130.4 seconds, and you blink roughly 15 times a minute."},"orbicularis-oris":{name:"Orbicularis oris",latin:"Musculus orbicularis oris",fn:"The ring of muscle in the lips. It closes and purses the mouth for eating, speaking, whistling and kissing.",att:"Woven from many other facial muscles that insert into the corners of the mouth.",size:[{k:"Width",v:"\u2248 6 cm"}],fact:"It is not a true sphincter: it is made of overlapping fibres from several muscles."},zygomaticus:{name:"Zygomaticus major and minor",latin:"Musculi zygomatici",fn:"Pull the corners of the mouth up and out, which makes a smile.",att:"From the zygomatic (cheek) bone to the corner of the mouth and upper lip.",size:[{k:"Length",v:"\u2248 7\u20139 cm"}],fact:"A real smile also uses the muscle around the eyes."},frontalis:{name:"Frontalis (forehead muscle)",latin:"Musculus frontalis",fn:"Raises the eyebrows and wrinkles the forehead, as when you look surprised.",att:"From the galea aponeurotica (the tendon sheet over the scalp) to the skin of the eyebrows.",size:[{k:"Height",v:"\u2248 5\u20136 cm"}],fact:"It has no bone attachment: it moves skin only."},platysma:{name:"Platysma",latin:"Platysma",fn:"A thin sheet just under the skin of the neck. It pulls the corners of the mouth and the lower lip downward and tightens the skin of the neck.",att:"From the lower jaw and skin of the lower face down over the collarbone to the skin of the upper chest.",size:[{k:"Thickness",v:"\u2248 1 mm"}],fact:"It stands out as cords in the neck when you grimace hard."},"neck-muscles":{name:"Scalenes and splenius capitis",latin:"Musculi scaleni et splenius capitis",fn:"The scalenes lift the first two ribs in breathing and bend the neck sideways. The splenius capitis, at the back, turns the head and tilts it backward.",att:"Scalenes: cervical vertebrae to ribs 1 and 2. Splenius: lower neck and upper thoracic spines to the skull behind the ear.",size:[{k:"Length",v:"\u2248 8\u201315 cm"}],fact:"The scalenes are accessory breathing muscles that work hard in asthma."},"serratus-anterior":{name:"Serratus anterior",latin:"Musculus serratus anterior",fn:"Holds the shoulder blade flat against the ribs and pulls it forward, as when you punch or push up.",att:"From the sides of ribs 1\u20138 to the inner (medial) border of the scapula.",size:[{k:"Digitations",v:"8 finger-like slips"}],fact:"Damage to its nerve causes \u201Cwinged scapula\u201D."},rhomboids:{name:"Rhomboids and levator scapulae",latin:"Musculi rhomboidei et levator scapulae",fn:"Pull the shoulder blades back toward the spine and lift them; they sit under the trapezius.",att:"From the spinous processes of C7 to T5 to the inner border of the scapula.",size:[{k:"Width",v:"\u2248 12 cm"}],fact:"They are what you squeeze when you \u201Cpinch the shoulder blades together\u201D."},"abdominal-wall-deep":{name:"Internal oblique and transversus abdominis",latin:"Musculi obliquus internus et transversus abdominis",fn:"Two deeper layers of the abdominal wall. The internal oblique helps twist and bend the trunk, and the transversus wraps around like a corset to hold the belly in and raise abdominal pressure.",att:"From the lower ribs, lumbar fascia and iliac crest to the midline sheath (linea alba).",size:[{k:"Thickness",v:"\u2248 3\u20135 mm each"}],fact:"The transversus is the deepest of the flat abdominal muscles and is used when you cough."},"quadratus-lumborum":{name:"Quadratus lumborum",latin:"Musculus quadratus lumborum",fn:"Bends the trunk sideways and steadies the 12th rib and the pelvis when you walk.",att:"From the iliac crest and lumbar vertebrae to the 12th rib.",size:[{k:"Length",v:"\u2248 12\u201315 cm"}],fact:"It is a common source of low back pain."},"pectoralis-minor":{name:"Pectoralis minor",latin:"Musculus pectoralis minor",fn:"Pulls the shoulder blade forward and down, and lifts the ribs slightly when breathing in with effort.",att:"From ribs 3\u20135 to the coracoid process of the scapula; it lies beneath pectoralis major.",size:[{k:"Length",v:"\u2248 10 cm"}],fact:"Nerves and vessels to the arm pass behind it."},"teres-major":{name:"Teres major",latin:"Musculus teres major",fn:"Draws the arm back and inward and rotates it medially, working with the latissimus dorsi.",att:"From the lower outer edge of the scapula to the upper front of the humerus.",size:[{k:"Length",v:"\u2248 14 cm"}],fact:"It is sometimes called the \u201Clat\u2019s little helper\u201D."},"brachialis-coracobrachialis":{name:"Brachialis and coracobrachialis",latin:"Musculi brachialis et coracobrachialis",fn:"The brachialis is the main muscle that bends the elbow, lying under the biceps. The coracobrachialis lifts the arm forward and holds it against the body.",att:"Brachialis: lower half of the humerus to the ulna. Coracobrachialis: coracoid process to the middle of the humerus.",size:[{k:"Brachialis",v:"\u2248 15 cm"}],fact:"The brachialis works no matter which way the forearm is turned."},"pronator-teres":{name:"Pronator teres",latin:"Musculus pronator teres",fn:"Turns the forearm so the palm faces down (pronation) and helps bend the elbow.",att:"From the medial epicondyle of the humerus and the ulna to the middle of the radius.",size:[{k:"Length",v:"\u2248 12 cm"}],fact:"Its name means \u201Cround turner\u201D."},"finger-tendons":{name:"Finger tendons (flexor)",latin:"Tendines musculorum flexorum",fn:"Long tendons from the forearm muscles run along the palm side of each finger to its bones. Pulling on them curls the fingers. Each finger is held in a tunnel of fibrous pulleys so the tendons stay close to the bone.",att:"Muscle bellies in the forearm to the middle and tip bones of each finger.",size:[{k:"Tendons",v:"9 flexor tendons pass the wrist (plus the thumb)"}],fact:"There are no muscles in the fingers themselves; they are moved by cables from the forearm."},"hand-muscles":{name:"Thenar and hypothenar muscles",latin:"Musculi thenares et hypothenares",fn:"The fleshy pads at the base of the thumb (thenar) and little finger (hypothenar). They move the thumb across the palm for pinching and grip, and spread and bend the little finger.",att:"From the carpal bones and wrist ligament to the bases of the thumb and little-finger bones.",size:[{k:"Thenar group",v:"4 small muscles"}],fact:"The thumb\u2019s opposition is one of the features that make the human hand so skilful."},"gluteus-minimus-piriformis":{name:"Gluteus minimus and piriformis",latin:"Musculi gluteus minimus et piriformis",fn:"The gluteus minimus lies under the gluteus medius and helps move the thigh out to the side. The piriformis turns the thigh outward and steadies the hip; the sciatic nerve passes next to it.",att:"Gluteus minimus: ilium to the greater trochanter. Piriformis: front of the sacrum to the greater trochanter.",size:[{k:"Piriformis",v:"\u2248 12 cm"}],fact:"Tightness of the piriformis can irritate the sciatic nerve."},"tfl-iliotibial":{name:"Tensor fasciae latae and iliotibial band",latin:"Musculus tensor fasciae latae et tractus iliotibialis",fn:"The tensor fasciae latae helps lift and turn the thigh. It pulls on a long, strong strip of fibrous tissue (the iliotibial band) that runs down the outer thigh to the shin and steadies the knee and hip.",att:"From the anterior superior iliac spine along the thigh to Gerdy\u2019s tubercle on the upper tibia.",size:[{k:"Band length",v:"\u2248 40\u201350 cm"}],fact:"The IT band is one of the strongest tissue straps in the body."},pectineus:{name:"Pectineus",latin:"Musculus pectineus",fn:"Bends the hip and pulls the thigh inward.",att:"From the top of the pubic bone to the back of the upper femur.",size:[{k:"Length",v:"\u2248 10 cm"}],fact:"It forms part of the floor of the femoral triangle in the groin."},popliteus:{name:"Popliteus",latin:"Musculus popliteus",fn:"A small muscle behind the knee that \u201Cunlocks\u201D the straight knee by turning the thigh bone slightly, so the knee can bend.",att:"From the outer femoral condyle to the back of the upper tibia.",size:[{k:"Length",v:"\u2248 10 cm"}],fact:"It is nicknamed \u201Cthe key to the knee\u201D."},"shin-extensors":{name:"Extensor digitorum longus and extensor hallucis longus",latin:"Musculi extensores digitorum et hallucis longi",fn:"Lift the toes and the front of the foot. The extensor hallucis longus raises the big toe.",att:"From the upper tibia and fibula, with tendons across the front of the ankle to the toes.",size:[{k:"Length",v:"\u2248 25\u201330 cm"}],fact:"Their tendons are the cords you see on top of the foot when you lift your toes."},"fibularis-brevis":{name:"Fibularis (peroneus) brevis",latin:"Musculus fibularis brevis",fn:"Turns the foot outward and supports the ankle on its outer side.",att:"From the lower fibula, behind the outer ankle bone, to the base of the 5th metatarsal.",size:[{k:"Length",v:"\u2248 20 cm"}],fact:"It is commonly strained in ankle sprains."},"foot-muscles":{name:"Plantar foot muscles and plantar fascia",latin:"Musculi plantares et fascia plantaris",fn:"A thick band of tissue (plantar fascia) runs from the heel to the toes and supports the arch like a bowstring, while small muscles on the sole, such as the abductor hallucis, move the toes and brace the foot.",att:"From the underside of the heel bone (calcaneus) to the toes.",size:[{k:"Plantar fascia",v:"\u2248 12\u201315 cm long, \u2248 2\u20133 mm thick"}],fact:"Inflammation of the plantar fascia causes heel pain (plantar fasciitis)."},skin:{name:"Skin",latin:"Cutis (integumentum commune)",fn:"The body\u2019s largest organ. It keeps water in and germs out, senses touch, pain and temperature, helps control body temperature through sweat and blood flow, and makes vitamin D when sunlit.",size:[{k:"Area",v:"\u2248 1.7\u20132.0 m\xB2"},{k:"Thickness",v:"\u2248 1.5\u20134 mm (eyelids \u2248 0.5, soles \u2248 4)"},{k:"Weight",v:"\u2248 4 kg"}],fact:"You shed about 30,000\u201340,000 dead skin cells every minute and replace the whole outer layer roughly every month. Use the opacity slider to see through it."},temporalis:{name:"Temporalis",latin:"Musculus temporalis",fn:"A fan-shaped chewing muscle on the side of the head that closes the jaw and pulls it back.",att:"From the temporal fossa of the skull to the coronoid process of the mandible.",size:[{k:"Shape",v:"broad fan, \u2248 7 cm wide"}],fact:"You can feel it bulge at your temple when you clench your teeth."},masseter:{name:"Masseter",latin:"Musculus masseter",fn:"The strongest chewing muscle for its size. It lifts the lower jaw to bite and grind food.",att:"From the zygomatic arch (cheekbone) to the angle and ramus of the mandible.",size:[{k:"Length",v:"\u2248 7 cm"},{k:"Thickness",v:"\u2248 1\u20131.5 cm"}],fact:"It can produce a bite force of well over 50 kg."},sternocleidomastoid:{name:"Sternocleidomastoid",latin:"Musculus sternocleidomastoideus",fn:"Turns the head to the opposite side and tilts it; both together bend the neck forward. It also helps lift the chest in deep breathing.",att:"From the sternum and collarbone up to the mastoid process behind the ear.",size:[{k:"Length",v:"\u2248 15\u201320 cm"}],fact:"It is the muscle that stands out as a ridge when you turn your head hard to one side."},trapezius:{name:"Trapezius",latin:"Musculus trapezius",fn:"A broad diamond-shaped muscle across the upper back. It lifts, pulls back and rotates the shoulder blade and helps hold the head up.",att:"From the skull base and spinous processes of C7 to T12, to the collarbone, acromion and spine of the scapula.",size:[{k:"Span",v:"\u2248 40 cm top to bottom"}],fact:"Its name comes from its shape: the two halves together look like a trapezoid."},latissimus:{name:"Latissimus dorsi",latin:"Musculus latissimus dorsi",fn:"The widest muscle of the back. It pulls the arm down and back and rotates it inward, as in climbing, swimming or a pull-up.",att:"From the lower spine, lower ribs and back of the pelvis to the upper front of the humerus.",size:[{k:"Width",v:"up to \u2248 25 cm"}],fact:"It is the main muscle behind the V-shape of a swimmer\u2019s back."},"pectoralis-major":{name:"Pectoralis major",latin:"Musculus pectoralis major",fn:"The large chest muscle. It pulls the arm across the body and rotates it inward, and it powers pushing movements.",att:"From the collarbone, sternum and upper abdominal sheath to the upper front of the humerus.",size:[{k:"Width",v:"\u2248 15\u201320 cm"}],fact:"Its fibres twist as they meet the humerus, so the lowest fibres attach highest."},deltoid:{name:"Deltoid",latin:"Musculus deltoideus",fn:"Rounds the shoulder and lifts the arm out to the side. Its front fibres raise it forward and its rear fibres pull it back.",att:"From the collarbone, acromion and scapular spine to the deltoid tuberosity on the humerus.",size:[{k:"Length",v:"\u2248 14\u201315 cm"}],fact:"It is named for its triangular shape, like the Greek letter delta."},"rotator-cuff":{name:"Rotator cuff (supraspinatus, infraspinatus, teres minor)",latin:"Musculi manicae rotatoriae",fn:"A group of small muscles on the shoulder blade that hold the ball of the humerus in its shallow socket and rotate the arm.",att:"From the shoulder blade to the greater tubercle of the humerus.",size:[{k:"Group",v:"4 muscles with the subscapularis (front, not shown)"}],fact:"It is one of the most commonly injured parts of the shoulder."},"biceps-brachii":{name:"Biceps brachii",latin:"Musculus biceps brachii",fn:"Bends the elbow and turns the forearm so the palm faces up (supination). It also helps raise the arm.",att:"Two heads from the scapula (coracoid process and above the glenoid) to the radius (radial tuberosity).",size:[{k:"Length",v:"\u2248 25\u201330 cm"}],fact:"\u201CBiceps\u201D means two heads."},"triceps-brachii":{name:"Triceps brachii",latin:"Musculus triceps brachii",fn:"Straightens the elbow. It is the main pushing muscle of the back of the arm.",att:"Three heads from the scapula and humerus to the olecranon of the ulna.",size:[{k:"Length",v:"\u2248 25\u201330 cm"}],fact:"It makes up about two-thirds of the upper arm\u2019s muscle bulk."},"forearm-flexors":{name:"Forearm flexors",latin:"Musculi flexores antebrachii",fn:"Bend the wrist and fingers, giving grip strength.",att:"From the medial epicondyle of the humerus, along the forearm, to the wrist and fingers.",size:[{k:"Group",v:"\u2248 8 muscles"}],fact:"Their tendons pass through the carpal tunnel at the wrist."},"forearm-extensors":{name:"Forearm extensors and brachioradialis",latin:"Musculi extensores antebrachii",fn:"Straighten the wrist and fingers and bend the elbow in a handshake position (brachioradialis).",att:"From the lateral epicondyle and lateral humerus along the back of the forearm to the hand.",size:[{k:"Group",v:"\u2248 10 muscles"}],fact:"Overuse of these tendons causes \u201Ctennis elbow\u201D."},"rectus-abdominis":{name:"Rectus abdominis",latin:"Musculus rectus abdominis",fn:"Bends the trunk forward and tightens the belly wall. Bands of tendon across it make the \u201Csix-pack\u201D.",att:"From the pubic bone to the 5th\u20137th rib cartilages and the xiphoid process.",size:[{k:"Length",v:"\u2248 35 cm"},{k:"Width",v:"\u2248 7\u20138 cm"}],fact:"Most people have 3 pairs of segments; some have 4 or 5."},"external-oblique":{name:"External oblique",latin:"Musculus obliquus externus abdominis",fn:"Twists the trunk, bends it sideways and compresses the abdomen. Its fibres run downward and inward, like putting your hands in your pockets.",att:"From the lower ribs to the iliac crest and the midline sheath of the abdomen.",size:[{k:"Thickness",v:"\u2248 1 cm"}],fact:"It is the largest and most superficial of the side abdominal muscles."},"erector-spinae":{name:"Erector spinae",latin:"Musculus erector spinae",fn:"Two long columns along the spine that keep you upright and bend the back backward and sideways.",att:"From the sacrum and pelvis up along the vertebrae and ribs to the skull base.",size:[{k:"Length",v:"\u2248 60 cm"},{k:"Width",v:"\u2248 5\u20137 cm"}],fact:"They work all day just to hold you upright, which is why a stiff back is so common."},"psoas-major":{name:"Psoas major (iliopsoas)",latin:"Musculus psoas major",fn:"The strongest hip flexor. It lifts the thigh toward the trunk and bends the lower spine.",att:"From the sides of the lumbar vertebrae, over the pelvic brim, to the lesser trochanter of the femur.",size:[{k:"Length",v:"\u2248 35 cm"}],fact:"It is the only muscle that directly links the spine to the leg."},diaphragm:{name:"Diaphragm",latin:"Diaphragma",fn:"The main breathing muscle, a dome under the lungs. It flattens as you breathe in, drawing air into the lungs, and relaxes upward as you breathe out.",att:"From the lower ribs, the xiphoid process and the upper lumbar vertebrae up to a central tendon.",size:[{k:"Thickness",v:"\u2248 3\u20135 mm"},{k:"Dome rises",v:"\u2248 4 cm up to the 5th rib"}],fact:"Hiccups are sudden spasms of the diaphragm."},"gluteus-maximus":{name:"Gluteus maximus",latin:"Musculus gluteus maximus",fn:"The largest muscle in the body. It straightens the hip to stand from sitting, climb and run.",att:"From the sacrum, coccyx and back of the ilium to the back of the femur and the iliotibial tract.",size:[{k:"Thickness",v:"up to \u2248 3 cm"}],fact:"Its size is one of the features that distinguish humans from other apes."},"gluteus-medius":{name:"Gluteus medius",latin:"Musculus gluteus medius",fn:"Holds the pelvis level when you stand on one leg and moves the thigh out to the side.",att:"From the outer surface of the ilium to the greater trochanter of the femur.",size:[{k:"Shape",v:"fan \u2248 12 cm wide"}],fact:"If it is weak, the opposite hip drops with each step (a Trendelenburg gait)."},quadriceps:{name:"Quadriceps femoris",latin:"Musculus quadriceps femoris",fn:"The big four-part muscle of the front of the thigh (rectus femoris and the vastus lateralis, medialis and intermedius). It straightens the knee.",att:"From the pel
